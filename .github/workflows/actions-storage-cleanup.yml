name: Actions storage cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to remove all Actions artifacts and caches in this repository
        required: true
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete repository Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifact_count=0
          artifact_bytes=0
          while IFS=$'\t' read -r id size name; do
            [[ -z "${id}" ]] && continue
            echo "Deleting artifact ${name} (${size} bytes, id ${id})"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" >/dev/null
            artifact_count=$((artifact_count + 1))
            artifact_bytes=$((artifact_bytes + size))
          done < <(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv')

          cache_count=0
          cache_bytes=0
          while IFS=$'\t' read -r id size key; do
            [[ -z "${id}" ]] && continue
            echo "Deleting cache ${key} (${size} bytes, id ${id})"
            gh api -X DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null
            cache_count=$((cache_count + 1))
            cache_bytes=$((cache_bytes + size))
          done < <(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .size_in_bytes, .key] | @tsv')

          remaining_artifacts=$(gh api "repos/${REPO}/actions/artifacts?per_page=1" --jq '.total_count')
          remaining_caches=$(gh api "repos/${REPO}/actions/caches?per_page=1" --jq '.total_count')

          echo "Deleted ${artifact_count} artifacts totaling ${artifact_bytes} bytes"
          echo "Deleted ${cache_count} caches totaling ${cache_bytes} bytes"
          echo "Remaining artifacts: ${remaining_artifacts}"
          echo "Remaining caches: ${remaining_caches}"

          test "${remaining_artifacts}" -eq 0
          test "${remaining_caches}" -eq 0
